name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install exprtools pending first release
        run: python -m pip install "exprtools @ git+https://github.com/BhuvaneshBhatt/exprtest.git@b6c38bd2b5fc27d8f88e30026d52868050308e18#subdirectory=exprtools"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - if: matrix.python-version == '3.13'
        run: |
          python -m build
          python -m twine check dist/*
